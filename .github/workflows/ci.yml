name: CI & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Web Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Verify Go Modules
        run: |
          go mod verify

      - name: Run Go Tests
        run: |
          go vet ./...
          go test -v -count=1 ./...

  release:
    name: Build & Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Web Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build Multi-Platform Binaries & Package
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          BUILD_TIME=$(date -u +"%Y%m%d.%H%M%S")
          GIT_COMMIT=$(git rev-parse --short HEAD)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.buildTime=${BUILD_TIME} -X main.gitCommit=${GIT_COMMIT}"

          mkdir -p dist build_out

          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
            "windows/arm64"
          )

          for PLATFORM in "${PLATFORMS[@]}"; do
            GOOS="${PLATFORM%/*}"
            GOARCH="${PLATFORM#*/}"
            PKG_NAME="doo-${TAG_NAME}-${GOOS}-${GOARCH}"
            DIR="build_out/${PKG_NAME}"
            mkdir -p "${DIR}"

            BIN_NAME="doo"
            if [ "${GOOS}" = "windows" ]; then
              BIN_NAME="doo.exe"
            fi

            echo "==> Building ${GOOS}/${GOARCH}..."
            GOOS="${GOOS}" GOARCH="${GOARCH}" CGO_ENABLED=0 go build -trimpath -ldflags="${LDFLAGS}" -o "${DIR}/${BIN_NAME}" ./cmd/doo

            if [ -f README.md ]; then
              cp README.md "${DIR}/"
            fi

            echo "==> Archiving ${PKG_NAME}..."
            if [ "${GOOS}" = "windows" ]; then
              (cd "${DIR}" && zip -r "../../dist/${PKG_NAME}.zip" *)
            else
              (cd "${DIR}" && tar -czf "../../dist/${PKG_NAME}.tar.gz" *)
            fi
          done

          echo "==> Generating checksums..."
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
